<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudaFácil - Planejamento</title>
</head>
<body>
<header>
    <h1>Planejamento Pessoal</h1>
</header>

<nav>
    <a href="index.html">Início</a> |
    <a href="cronograma.html">Cronograma</a> |
    <a href="dicas.html">Dicas</a> |
    <a href="materiais.html">Materiais</a> |
    <a href="planejamento.html">Planejamento</a>
</nav>

<main>
    <section>
        <h2>Monte seu plano</h2>
        <article>
            <form action="#" method="post">
                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </p>

                <p>
                    <label for="materia">Matéria:</label><br>
                    <input list="materias" id="materia" name="materia" placeholder="Escolha ou digite uma matéria" required>
                    <datalist id="materias">
                        <option value="desenvolvimento front web">
                        <option value="banco de dados">
                        <option value=" Design profissional">
                        <option value="algoritimos ">
                        <option value="linguagem computacional">
                    </datalist>
                </p>

                <p>
                    <label for="data">Data da próxima prova:</label><br>
                    <input type="date" id="data" name="data" required>
                </p>

                <p>
                    <label for="dificuldade">Nível de dificuldade (1 a 10):</label><br>
                    <input type="range" id="dificuldade" name="dificuldade" min="1" max="10">
                </p>

                <p>
                    <label for="arquivo">Enviar material:</label><br>
                    <input type="file" id="arquivo" name="arquivo">
                </p>

                <p>
                    <label for="observacao">Observações:</label><br>
                    <textarea id="observacao" name="observacao" rows="5" cols="40" placeholder="Escreva o que precisa revisar"></textarea>
                </p>

                <button type="submit">Salvar planejamento</button>
                <button type="reset">Limpar</button>
            </form>
        </article>
    </section>

    <aside>
        <h2>Objetivo</h2>
        <p>Use este formulário como modelo para registrar prioridades e datas importantes de estudos.</p>
    </aside>
</main>

<footer>
    <hr>
    <p>avaliaçao acadêmica em HTML puro.</p>
    <p>Data da prova: <time datetime="2026-09-25">25/09/2026</time></p>
</footer>

</body>
</html>
